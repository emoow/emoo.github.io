<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Art Corridor with Website Screenshots</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            z-index: 1000;
        }
        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: 1.2px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            user-select: none;
            opacity: 0.9;
            background: radial-gradient(
                circle at 30% 30%,
                rgba(255,255,255,0.55) 0%,
                rgba(255,255,255,0.22) 45%,
                rgba(255,255,255,0.08) 100%
            );
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 0 18px rgba(74,144,226,0.65),
                inset 0 0 12px rgba(255,255,255,0.15);
            color: hsla(0, 0%, 100%, 0.95);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        button:hover {
            background: hsl(210, 38%, 66%);
            transform: scale(1.05);
        }
        button:active {
            background: hsl(210, 30%, 60%);
            transform: scale(0.98);
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
        }
        #upload-section {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            color: white;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        Use the buttons below to navigate<br>
        Arrow keys also work: ↑/↓ = move, ←/→ = turn<br>
        Click on artworks to visit websites
    </div>
    <div id="controls">
        <button id="turnLeft">← Turn Left</button>
        <button id="backward">↓ Backward</button>
        <button id="forward">↑ Forward</button>
        <button id="turnRight">Turn Right →</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 1, 50);

        const textureLoader = new THREE.TextureLoader();

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Raycaster for interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveObjects = [];

        // Movement variables
        let moveSpeed = 0.5;
        let turnSpeed = 0.05;
        let targetRotation = 0;
        let currentRotation = 0;

        // Create corridor
        const corridorLength = 40;
        const corridorWidth = 6;
        const corridorHeight = 4;

        // Floor
        const floorGeometry = new THREE.PlaneGeometry(corridorWidth, corridorLength);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2c2c2c,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(floorGeometry, floorMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = corridorHeight;
        scene.add(ceiling);

        // Walls
        const wallGeometry = new THREE.PlaneGeometry(corridorLength, corridorHeight);
        const wallMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3d3d3d,
            roughness: 0.7
        });

        // Left wall
        const leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.x = -corridorWidth / 2;
        leftWall.position.y = corridorHeight / 2;
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Right wall
        const rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.x = corridorWidth / 2;
        rightWall.position.y = corridorHeight / 2;
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // Website data with screenshots
        // Each entry needs: name, url, and screenshot (image path)
        // Add your own screenshots to assets/website/ folder
        const websites = [
            { 
                name: 'kimi AI',
                url: 'https://kimi.com',
                screenshot: 'assets/website/kimi.png'
            },
            { 
                name: 'Emoo WordPress',
                url: 'https://emoo581.wordpress.com/',
                screenshot: 'assets/website/emoo581.jpg'
            }
            // Add more websites here with their screenshots:
            // { 
            //     name: 'GitHub',
            //     url: 'https://github.com',
            //     screenshot: 'assets/website/github.png'
            // },
        ];

        // Store frame meshes for updating
        const frameMeshes = [];

        // Create placeholder texture
        function createPlaceholderTexture(websiteData) {
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, 1080);
            gradient.addColorStop(0, '#2c3e50');
            gradient.addColorStop(1, '#34495e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1920, 1080);
            
            // Website name
            ctx.fillStyle = '#ecf0f1';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(websiteData.name, 960, 480);
            
            // URL
            ctx.font = '40px Arial';
            ctx.fillStyle = '#3498db';
            ctx.fillText(websiteData.url, 960, 560);
            
            return new THREE.CanvasTexture(canvas);
        }

        // Create art frame with 16:9 aspect ratio (webpage shape)
        function createArtFrame(websiteData, posX, posZ, rotation, index) {
            const frameGroup = new THREE.Group();
            
            // 16:9 aspect ratio for webpage feel
            const frameWidth = 2.4;  // Wider like a monitor
            const frameHeight = 1.35; // 16:9 ratio
            
            // Create texture (placeholder or uploaded image)
            let texture;
            if (websiteData.screenshot) {
                texture = textureLoader.load(
                    websiteData.screenshot,
                    undefined,
                    undefined,
                    () => {
                        texture = createPlaceholderTexture(websiteData);
                    }
                );
            } else {
                texture = createPlaceholderTexture(websiteData);
            }

            // Canvas (the screen)
            const canvasGeometry = new THREE.PlaneGeometry(frameWidth, frameHeight);
            const canvasMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.3,
                metalness: 0.1
            });
            
            const canvas = new THREE.Mesh(canvasGeometry, canvasMaterial);
            canvas.castShadow = true;
            canvas.userData = {
                url: websiteData.url,
                name: websiteData.name,
                isInteractive: true,
                websiteIndex: index,
                material: canvasMaterial
            };
            
            // Add to interactive objects
            interactiveObjects.push(canvas);
            frameMeshes.push(canvas);
            
            frameGroup.add(canvas);

            // Modern frame border (thin bezel like modern monitors)
            const frameThickness = 0.05;
            const frameBorderGeometry = new THREE.BoxGeometry(
                frameWidth + 0.1, 
                frameHeight + 0.1, 
                frameThickness
            );
            const frameBorderMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1a1a1a,
                roughness: 0.2,
                metalness: 0.8
            });
            const frameBorder = new THREE.Mesh(frameBorderGeometry, frameBorderMaterial);
            frameBorder.position.z = -frameThickness / 2 - 0.01;
            frameBorder.castShadow = true;
            frameGroup.add(frameBorder);

            // LED strip effect (subtle glow at bottom)
            const ledGeometry = new THREE.PlaneGeometry(frameWidth + 0.08, 0.02);
            const ledMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x3498db,
                transparent: true,
                opacity: 0.3
            });
            const ledStrip = new THREE.Mesh(ledGeometry, ledMaterial);
            ledStrip.position.y = -(frameHeight / 2) - 0.06;
            ledStrip.position.z = 0.01;
            frameGroup.add(ledStrip);

            // Spotlight for each frame
            const spotLight = new THREE.SpotLight(0xffffff, 0.6);
            spotLight.position.set(posX > 0 ? posX - 1 : posX + 1, corridorHeight - 0.5, posZ);
            spotLight.target = canvas;
            spotLight.angle = Math.PI / 6;
            spotLight.penumbra = 0.3;
            spotLight.castShadow = true;
            scene.add(spotLight);

            frameGroup.position.set(posX, corridorHeight / 2, posZ);
            frameGroup.rotation.y = rotation;
            scene.add(frameGroup);
        }

        // Place art on both sides of corridor - only create frames for available websites
        const spacing = 5;
        const totalWebsites = websites.length;
        
        // Calculate how many frames we need on each side
        const framesPerSide = Math.ceil(totalWebsites / 2);
        
        for (let i = 0; i < framesPerSide; i++) {
            const z = -corridorLength / 2 + spacing + i * spacing;
            
            // Left wall art - use even indices (0, 2, 4...)
            const leftIndex = i * 2;
            if (leftIndex < totalWebsites) {
                createArtFrame(
                    websites[leftIndex],
                    -corridorWidth / 2 + 0.1,
                    z,
                    Math.PI / 2,
                    leftIndex
                );
            }
            
            // Right wall art - use odd indices (1, 3, 5...)
            const rightIndex = i * 2 + 1;
            if (rightIndex < totalWebsites) {
                createArtFrame(
                    websites[rightIndex],
                    corridorWidth / 2 - 0.1,
                    z,
                    -Math.PI / 2,
                    rightIndex
                );
            }
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight.position.set(0, 10, 0);
        scene.add(directionalLight);

        // Mouse click handler for interactive frames
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isInteractive) {
                    // Open URL in new window
                    window.open(object.userData.url, '_blank');
                    
                    // Visual feedback: brief color change
                    const originalColor = object.material.color.clone();
                    object.material.color.setHex(0x3498db);
                    
                    setTimeout(() => {
                        object.material.color.copy(originalColor);
                    }, 300);
                }
            }
        }

        window.addEventListener('click', onMouseClick);

        // Movement functions
        function moveForward() {
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), currentRotation);
            
            const newPosition = camera.position.clone().add(direction.multiplyScalar(moveSpeed));
            
            if (Math.abs(newPosition.x) < corridorWidth / 2 - 0.5 &&
                Math.abs(newPosition.z) < corridorLength / 2 - 0.5) {
                camera.position.copy(newPosition);
            }
        }

        function moveBackward() {
            const direction = new THREE.Vector3(0, 0, 1);
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), currentRotation);
            
            const newPosition = camera.position.clone().add(direction.multiplyScalar(moveSpeed));
            
            if (Math.abs(newPosition.x) < corridorWidth / 2 - 0.5 &&
                Math.abs(newPosition.z) < corridorLength / 2 - 0.5) {
                camera.position.copy(newPosition);
            }
        }

        function turnLeft() {
            targetRotation += Math.PI / 2;
        }

        function turnRight() {
            targetRotation -= Math.PI / 2;
        }

        // Button controls
        document.getElementById('forward').addEventListener('click', moveForward);
        document.getElementById('backward').addEventListener('click', moveBackward);
        document.getElementById('turnLeft').addEventListener('click', turnLeft);
        document.getElementById('turnRight').addEventListener('click', turnRight);

        // Keyboard controls
        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    moveForward();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    moveBackward();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    turnLeft();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    turnRight();
                    break;
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Smooth rotation
            const rotationDiff = targetRotation - currentRotation;
            currentRotation += rotationDiff * turnSpeed;
            
            camera.rotation.y = currentRotation;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
